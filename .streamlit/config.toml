[theme]
font = "system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
baseRadius = "0.95rem"
buttonRadius = "0.85rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#003c69"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#eaf0f6"
textColor = "#122e43"
borderColor = "#8298aa"

[theme.dark]
primaryColor = "#8bcbf5"
backgroundColor = "#101c28"
secondaryBackgroundColor = "#1c2b39"
textColor = "#e9f2fb"
borderColor = "#697f90"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
